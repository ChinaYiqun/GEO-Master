name: Validate GEO-Master data and adapters

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Compile Python scripts
        run: |
          python -m py_compile \
            scripts/import_monitor_runs.py \
            scripts/test_import_monitor_runs.py \
            scripts/geoready_audit_adapter.py \
            scripts/test_geoready_audit_adapter.py \
            scripts/summarize_visibility.py \
            scripts/test_summarize_visibility.py \
            scripts/validate_examples.py \
            scripts/validate_integration_registry.py

      - name: Test GeoReady audit adapter
        run: python scripts/test_geoready_audit_adapter.py

      - name: Test monitoring adapters
        run: python scripts/test_import_monitor_runs.py

      - name: Test visibility summary CLI
        run: python scripts/test_summarize_visibility.py

      - name: Smoke-test visibility report generation
        run: |
          python scripts/summarize_visibility.py templates/weekly-monitoring.csv --format markdown
          python scripts/summarize_visibility.py templates/weekly-monitoring.csv --format json > /tmp/geo-summary.json

      - name: Validate JSON schemas and examples
        run: python scripts/validate_examples.py

      - name: Validate integration capability registry
        run: python scripts/validate_integration_registry.py
