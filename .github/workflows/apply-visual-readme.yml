name: Apply visual README

on:
  push:
    branches:
      - agent/add-geo-visual-assets
    paths:
      - .github/workflows/apply-visual-readme.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-geo-visual-assets
          fetch-depth: 0

      - name: Assemble README
        run: |
          cat .github/readme-visual/part-*.b64 | tr -d '\n' | base64 --decode > README.md
          test "$(grep -c 'assets/geo-master/.*\.webp' README.md)" -eq 10
          for image in $(grep -o 'assets/geo-master/[^" ]*\.webp' README.md | sort -u); do
            test -f "$image"
          done

      - name: Remove staging files
        run: |
          rm -rf .github/readme-visual
          rm .github/workflows/apply-visual-readme.yml

      - name: Commit visual README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/readme-visual .github/workflows/apply-visual-readme.yml
          git commit -m "docs(readme): add section-specific GEO visuals"
          git push origin HEAD:agent/add-geo-visual-assets
